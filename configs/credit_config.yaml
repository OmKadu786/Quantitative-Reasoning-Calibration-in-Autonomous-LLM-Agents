# Kaggle Credit Card Fraud Dataset Configuration (Raw Un-tuned Baseline)
dataset:
  name: credit_card_fraud
  imbalance_ratio: 0.0017
  num_classes: 2

raw_untuned_baseline_defaults:
  scale_pos_weight: 1.0
  decision_threshold: 0.50
  focal_gamma: 0.0
  max_depth: 6
  learning_rate: 0.10

search_space_bounds:
  scale_pos_weight: [1.0, 50.0]
  decision_threshold: [0.10, 0.90]
  focal_gamma: [0.0, 5.0]
  max_depth: [3, 12]
  learning_rate: [0.01, 0.30]
