# QuaRCAA Default System Configuration
model_sampling:
  temperature: 0.2
  top_p: 0.95

execution_harness:
  seeds: [42, 123, 999]
  max_api_retries: 5
  initial_retry_delay_sec: 2.0

evaluated_models:
  - name: deepseek-reasoner
    provider: deepseek
    reasoning_type: trained_extended
    weights: open
  - name: gpt-4o
    provider: openai
    reasoning_type: prompted_step_by_step
    weights: proprietary
  - name: claude-3-5-sonnet-20241022
    provider: anthropic
    reasoning_type: prompted_step_by_step
    weights: proprietary
